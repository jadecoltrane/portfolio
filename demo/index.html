<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>座舱 Agent · 安全委托闭环 Demo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand">座舱 Agent <span>安全委托闭环 · 机制演示</span></div>
  <div class="badge">概念 Demo · 模拟车控 · 非量产系统</div>
</header>

<main>
  <!-- 左：仪表 + 场景 -->
  <aside class="panel left" id="status-panel">
    <section>
      <h3>车辆状态（真相之源）</h3>
      <div class="stat-grid">
        <div class="stat"><label>挡位</label><b id="st-gear">D</b></div>
        <div class="stat"><label>车速</label><b><span id="st-speed">60</span> km/h</b></div>
        <div class="stat"><label>网络</label><b id="st-network" class="ok">在线</b></div>
        <div class="stat"><label>空调</label><b id="st-temp">22°C</b></div>
        <div class="stat"><label>音量</label><b id="st-volume">40</b></div>
        <div class="stat"><label>车外灯</label><b id="st-ext-lights">开</b></div>
        <div class="stat"><label>阅读灯</label><b id="st-reading-light">开</b></div>
      </div>
      <div class="route" id="st-route">当前路线：公司（默认）</div>
      <button id="gear-toggle" class="wide">切到 P 挡（停车）</button>
    </section>
    <section>
      <h3>停车后继续</h3>
      <div id="pending-tasks"><span class="dim">无</span></div>
    </section>
    <section>
      <h3>演示场景</h3>
      <div class="col">
        <button class="scenario" data-scenario="s1">场景 1｜“我有点冷”</button>
        <button class="scenario" data-scenario="s2">场景 2｜“充电 + 遛狗”</button>
        <button class="scenario" data-scenario="s3">场景 3｜改行程·付款·断网</button>
        <button class="scenario danger" data-scenario="lights">证据场景｜“关闭所有灯光”</button>
      </div>
    </section>
  </aside>

  <!-- 中：对话 / 中控 -->
  <section class="panel center">
    <div id="chat"></div>
    <div class="input-row">
      <input id="input" type="text" placeholder="对 Agent 说点什么…（如：我有点冷）" autocomplete="off">
      <button id="send">发送</button>
    </div>
  </section>

  <!-- 右：测试控制台 + 行为记录 -->
  <aside class="panel right">
    <section>
      <h3>测试控制台 <span class="tag">注入工具，非系统能力</span></h3>
      <label class="switch-row"><input type="checkbox" id="inject-offline"> 切断网络</label>
      <label class="switch-row"><input type="checkbox" id="inject-failure"> 工具执行故障</label>
      <div class="chips">
        <button class="chip" data-ambiguity="missing">注入：缺少必要参数</button>
        <button class="chip" data-ambiguity="candidates">注入：多候选歧义</button>
      </div>
    </section>
    <section>
      <h3>用户授权</h3>
      <div id="permissions"></div>
      <div class="dim small">安全底线（如行驶中关外灯）不随授权放宽。</div>
    </section>
    <section class="grow">
      <h3>行为记录 <span class="tag">请求 → 策略 → 结果</span></h3>
      <div id="action-log"></div>
    </section>
  </aside>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
