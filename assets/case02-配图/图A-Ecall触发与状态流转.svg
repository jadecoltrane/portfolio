<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .label{font-size:14px;font-weight:600;fill:#1f2937}
    .small{font-size:11px;fill:#6b7280}
    .head{font-size:12px;font-weight:700;fill:#374151}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="530" fill="#ffffff"/>
  <text x="40" y="42" class="title">E-call 触发与状态流转</text>
  <text x="40" y="62" class="sub">触发时机不由用户在界面上决定；全程可最小化但不可隐藏；结束后系统自行收尾（脱敏重绘，非原文件导出）</text>

  <text x="40" y="96" class="head">① 触发</text>
  <rect x="40" y="106" width="200" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="140" y="128" text-anchor="middle" class="label">物理 SOS 按键</text>
  <text x="140" y="146" text-anchor="middle" class="small">用户主动触发</text>

  <rect x="40" y="174" width="200" height="62" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="140" y="196" text-anchor="middle" class="label" fill="#b91c1c">碰撞信号（气囊展开）</text>
  <text x="140" y="213" text-anchor="middle" class="small" fill="#b91c1c">系统自动触发</text>
  <text x="140" y="228" text-anchor="middle" class="small" fill="#b91c1c">用户可能无法参与</text>

  <path d="M240,132 H272 V168" fill="none" stroke="#6b7280" stroke-width="1.2"/>
  <path d="M240,205 H272 V168" fill="none" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="272" y1="168" x2="306" y2="168" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="312" y="96" class="head">② 呼叫中</text>
  <rect x="312" y="130" width="200" height="76" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="412" y="158" text-anchor="middle" class="label" fill="#1d4ed8">全屏呼叫界面</text>
  <text x="412" y="177" text-anchor="middle" class="small" fill="#1d4ed8">接通状态以文案直述</text>
  <text x="412" y="193" text-anchor="middle" class="small" fill="#1d4ed8">不依赖图标暗示</text>

  <text x="632" y="96" class="head">④ 结束</text>
  <line x1="512" y1="168" x2="626" y2="168" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="632" y="130" width="208" height="76" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="736" y="158" text-anchor="middle" class="label">通话结束</text>
  <text x="736" y="177" text-anchor="middle" class="small">页面自动关闭</text>
  <text x="736" y="193" text-anchor="middle" class="small">不留残留态，无需用户收拾</text>

  <text x="312" y="266" class="head">③ 退到后台</text>
  <line x1="412" y1="206" x2="412" y2="272" stroke="#2563eb" stroke-width="1.4" marker-start="url(#arrb)" marker-end="url(#arrb)"/>
  <text x="426" y="244" class="small" fill="#1d4ed8">点击状态栏标识回到全屏</text>
  <rect x="312" y="276" width="200" height="66" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="412" y="302" text-anchor="middle" class="label" fill="#1d4ed8">最小化到状态栏</text>
  <text x="412" y="322" text-anchor="middle" class="small" fill="#1d4ed8">标识常驻 · 任务不可被隐藏</text>

  <rect x="40" y="374" width="800" height="106" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="64" y="400" class="head" fill="#92400e">贯穿全程｜优先级仲裁：紧急呼叫优先级最高</text>

  <circle cx="70" cy="428" r="3.5" fill="#dc2626"/>
  <text x="82" y="432" class="label">其他来电呼入</text>
  <text x="82" y="452" class="small">被拦截，不打断紧急呼叫</text>

  <circle cx="336" cy="428" r="3.5" fill="#dc2626"/>
  <text x="348" y="432" class="label">已有通话进行中</text>
  <text x="348" y="452" class="small">让位于紧急呼叫</text>

  <circle cx="602" cy="428" r="3.5" fill="#dc2626"/>
  <text x="614" y="432" class="label">蓝牙来电</text>
  <text x="614" y="452" class="small">改由手机端接听</text>

  <text x="40" y="508" class="small">对应案例②：阶段三 授权（谁能打断谁）· 阶段四 执行回显（常驻标识）· 阶段五 恢复（自动收尾）</text>
</svg>
