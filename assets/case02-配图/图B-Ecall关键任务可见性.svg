<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .label{font-size:14px;font-weight:600;fill:#1f2937}
    .small{font-size:11px;fill:#6b7280}
    .tiny{font-size:9px;font-weight:700;fill:#b91c1c}
    .ghost{font-size:11px;fill:#9ca3af}
  </style>
  <defs>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="40" y="42" class="title">关键任务的可见性：全屏态 / 最小化态</text>
  <text x="40" y="62" class="sub">脱敏线框重绘，非原界面导出。全图仅状态栏常驻标识画实，其余一律灰块——它就是这一页的论点</text>

  <text x="566" y="104" class="small" fill="#b91c1c">状态栏常驻标识 · 点击回到全屏</text>
  <line x1="562" y1="108" x2="536" y2="133" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrr)"/>

  <!-- 左：全屏态 -->
  <rect x="60" y="130" width="340" height="200" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M60,154 H400" stroke="#d1d5db" stroke-width="1"/>
  <rect x="60" y="130" width="340" height="24" rx="10" fill="#f3f4f6"/>
  <rect x="60" y="144" width="340" height="10" fill="#f3f4f6"/>
  <rect x="350" y="138" width="14" height="8" rx="2" fill="#d1d5db"/>
  <rect x="368" y="138" width="14" height="8" rx="2" fill="#d1d5db"/>
  <circle cx="230" cy="205" r="22" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="230" y="248" text-anchor="middle" class="label">紧急服务中心</text>
  <text x="230" y="268" text-anchor="middle" class="small">正在接通…（状态以文案直述）</text>
  <path d="M60,304 H400" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="76" y="310" width="40" height="12" rx="3" fill="#f3f4f6"/>
  <rect x="126" y="310" width="40" height="12" rx="3" fill="#f3f4f6"/>
  <rect x="176" y="310" width="40" height="12" rx="3" fill="#f3f4f6"/>

  <!-- 右：最小化态 -->
  <rect x="480" y="130" width="340" height="200" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <path d="M480,154 H820" stroke="#d1d5db" stroke-width="1"/>
  <rect x="480" y="130" width="340" height="24" rx="10" fill="#f3f4f6"/>
  <rect x="480" y="144" width="340" height="10" fill="#f3f4f6"/>
  <rect x="496" y="135" width="60" height="15" rx="7.5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="526" y="146" text-anchor="middle" class="tiny">SOS</text>
  <rect x="770" y="138" width="14" height="8" rx="2" fill="#d1d5db"/>
  <rect x="788" y="138" width="14" height="8" rx="2" fill="#d1d5db"/>
  <rect x="496" y="170" width="150" height="110" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="571" y="229" text-anchor="middle" class="ghost">常规内容</text>
  <rect x="660" y="170" width="144" height="110" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="732" y="229" text-anchor="middle" class="ghost">常规内容</text>
  <path d="M480,304 H820" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="496" y="310" width="40" height="12" rx="3" fill="#f3f4f6"/>
  <rect x="546" y="310" width="40" height="12" rx="3" fill="#f3f4f6"/>
  <rect x="596" y="310" width="40" height="12" rx="3" fill="#f3f4f6"/>

  <text x="230" y="358" text-anchor="middle" class="label">全屏态｜任务占据主界面</text>
  <text x="230" y="377" text-anchor="middle" class="small">用户不必做任何操作，流程自行推进</text>
  <text x="650" y="358" text-anchor="middle" class="label">最小化态｜用户可继续常规使用</text>
  <text x="650" y="377" text-anchor="middle" class="small">任务让路，但标识不消失</text>

  <rect x="40" y="398" width="800" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="64" y="421" class="label">设计要点：安全关键任务允许被最小化，不允许被隐藏。</text>
  <text x="64" y="440" class="small">可见性由状态栏承担，退出由系统承担——用户不必记得自己正在通话中。这正是案例②中 Agent 执行回显的同一条规则。</text>
</svg>
