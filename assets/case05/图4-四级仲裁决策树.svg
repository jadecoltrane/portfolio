<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .node{font-size:13px;font-weight:600;fill:#1f2937}
    .resp{font-size:15px;font-weight:700}
    .item{font-size:12px;fill:#374151}
    .small{font-size:11px;fill:#6b7280}
    .stamp{font-size:11px;font-weight:700;fill:#b45309}
    .from{font-size:10px;fill:#9ca3af}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="880" height="460" fill="#ffffff"/>

  <text x="40" y="42" class="title">四级状态仲裁模型</text>
  <text x="40" y="63" class="sub">按「注意力竞争程度」与「是否可恢复」两个维度重新切分系统响应</text>

  <rect x="660" y="28" width="180" height="22" rx="11" fill="#fffbeb" stroke="#d97706"/>
  <text x="750" y="43" text-anchor="middle" class="stamp">复盘产物 · 非当年交付物</text>

  <!-- 树 -->
  <g>
    <rect x="380" y="92" width="120" height="34" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="440" y="114" text-anchor="middle" class="node">系统事件</text>
    <path d="M440 126 L440 146" stroke="#9ca3af" stroke-width="1.4"/>
    <path d="M160 146 L720 146" stroke="#9ca3af" stroke-width="1.4"/>
    <path d="M160 146 L160 176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
    <path d="M440 146 L440 176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
    <path d="M720 146 L720 176" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>

    <text x="160" y="196" text-anchor="middle" class="node">普通更新</text>
    <text x="440" y="196" text-anchor="middle" class="node" fill="#b45309">注意力冲突</text>
    <text x="720" y="196" text-anchor="middle" class="node" fill="#dc2626">安全事件</text>

    <path d="M160 208 L160 232" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
    <path d="M720 208 L720 232" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a)"/>
    <path d="M440 208 L440 218" stroke="#d97706" stroke-width="1.4"/>
    <path d="M330 218 L550 218" stroke="#d97706" stroke-width="1.4"/>
    <path d="M330 218 L330 232" stroke="#d97706" stroke-width="1.4" marker-end="url(#a)"/>
    <path d="M550 218 L550 232" stroke="#d97706" stroke-width="1.4" marker-end="url(#a)"/>
  </g>

  <!-- 四个响应 -->
  <g transform="translate(80,240)">
    <rect width="160" height="92" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="80" y="30" text-anchor="middle" class="resp" fill="#4b5563">继续</text>
    <text x="80" y="52" text-anchor="middle" class="item">保持当前状态</text>
    <text x="80" y="72" text-anchor="middle" class="small">无需恢复</text>
  </g>
  <g transform="translate(250,240)">
    <rect width="160" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="80" y="30" text-anchor="middle" class="resp" fill="#b45309">弱化</text>
    <text x="80" y="52" text-anchor="middle" class="item">半透明 · 停动效</text>
    <text x="80" y="72" text-anchor="middle" class="small">让注意力 · 可恢复</text>
  </g>
  <g transform="translate(470,240)">
    <rect width="160" height="92" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="80" y="30" text-anchor="middle" class="resp" fill="#92400e">暂停</text>
    <text x="80" y="52" text-anchor="middle" class="item">停响应 · 留进度</text>
    <text x="80" y="72" text-anchor="middle" class="small">让操作 / 让屏幕 · 可恢复</text>
  </g>
  <g transform="translate(640,240)">
    <rect width="160" height="92" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" class="resp" fill="#b91c1c">终止</text>
    <text x="80" y="52" text-anchor="middle" class="item">隐藏 · 清除状态</text>
    <text x="80" y="72" text-anchor="middle" class="small">不可恢复 · 不续播</text>
  </g>

  <!-- 与原始分类的对应 -->
  <line x1="40" y1="358" x2="840" y2="358" stroke="#e5e7eb"/>
  <text x="40" y="382" class="item" font-weight="700">在原始二元分类里的位置</text>
  <text x="160" y="406" text-anchor="middle" class="from">← 不打断</text>
  <text x="330" y="406" text-anchor="middle" class="from" fill="#b45309" font-weight="700">← 不打断（分辨率不足）</text>
  <text x="550" y="406" text-anchor="middle" class="from" fill="#b45309" font-weight="700">← 不打断（分辨率不足）</text>
  <text x="720" y="406" text-anchor="middle" class="from">← 打断</text>
  <text x="40" y="436" class="small">模型没有改变任何一条当年的实际行为，只是给已经存在的中间态找到了准确的名字。</text>
</svg>
