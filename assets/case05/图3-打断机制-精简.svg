<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .bh{font-size:15px;font-weight:700;fill:#ffffff}
    .cat{font-size:12.5px;font-weight:700;fill:#374151}
    .item{font-size:13.5px;fill:#1f2937}
  </style>
  <rect width="800" height="300" fill="#ffffff"/>
  <g>
    <rect width="212" height="200" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="18" y="30" class="cat">打断原则</text>
    <text x="18" y="66" class="item">动画播放后原则上</text>
    <text x="18" y="92" class="item" font-weight="700" fill="#2563eb">不会停止</text>
    <text x="18" y="118" class="item">直至播放完成，除非</text>
    <text x="18" y="150" class="item" font-weight="700" fill="#dc2626">影响驾驶安全的</text>
    <text x="18" y="174" class="item" font-weight="700" fill="#dc2626">紧急情况</text>
  </g>
  <g transform="translate(258,0)">
    <rect width="250" height="34" rx="8" fill="#b45309"/>
    <text x="125" y="23" text-anchor="middle" class="bh">打断逻辑</text>
    <rect y="46" width="250" height="248" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="20" y="82" class="cat" fill="#b45309">安全类</text>
    <text x="20" y="106" class="item">紧急警告：SOS、热失控等</text>
    <line x1="20" y1="128" x2="230" y2="128" stroke="#fde68a"/>
    <text x="20" y="160" class="cat" fill="#b45309">系统类</text>
    <text x="20" y="184" class="item">AVM 倒车影像</text>
    <line x1="20" y1="206" x2="230" y2="206" stroke="#fde68a"/>
    <text x="20" y="238" class="cat" fill="#b45309">用户主动操作类</text>
    <text x="20" y="262" class="item">切换桌面主题</text>
  </g>
  <g transform="translate(550,0)">
    <rect width="250" height="34" rx="8" fill="#4f46e5"/>
    <text x="125" y="23" text-anchor="middle" class="bh">不打断逻辑</text>
    <rect y="46" width="250" height="248" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="20" y="82" class="cat" fill="#4338ca">语音交互类</text>
    <text x="20" y="106" class="item">语音唤醒</text>
    <line x1="20" y1="128" x2="230" y2="128" stroke="#c7d2fe"/>
    <text x="20" y="160" class="cat" fill="#4338ca">导航类</text>
    <text x="20" y="184" class="item">切换驾驶模式 / 拖地图</text>
    <line x1="20" y1="206" x2="230" y2="206" stroke="#c7d2fe"/>
    <text x="20" y="238" class="cat" fill="#4338ca">系统反馈类</text>
    <text x="20" y="262" class="item">toast / 弹窗 / smartbar</text>
  </g>
</svg>
