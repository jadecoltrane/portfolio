<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .label{font-size:14px;font-weight:600;fill:#1f2937}
    .small{font-size:11px;fill:#6b7280}
    .cell{font-size:12px;fill:#1f2937}
    .head{font-size:12px;font-weight:700;fill:#374151}
  </style>
  <rect width="880" height="520" fill="#ffffff"/>
  <text x="40" y="42" class="title">系统层级与事件仲裁</text>
  <text x="40" y="62" class="sub">彩蛋挂件采用相对层级定位：让位于一切安全与系统级内容，高于普通桌面内容（不使用内部层级编号）</text>

  <!-- 左：层级堆叠（等距平行四边形） -->
  <g>
    <g transform="translate(60,110)">
      <polygon points="40,0 300,0 260,44 0,44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="150" y="20" text-anchor="middle" class="label" fill="#b91c1c">安全提示 / 阻断性弹窗</text>
      <text x="150" y="36" text-anchor="middle" class="small">最高层 · 无条件覆盖一切</text>
    </g>
    <g transform="translate(60,170)">
      <polygon points="40,0 300,0 260,44 0,44" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
      <text x="150" y="27" text-anchor="middle" class="label">系统状态（语音 / 通知）</text>
    </g>
    <g transform="translate(60,230)">
      <polygon points="40,0 300,0 260,44 0,44" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="150" y="20" text-anchor="middle" class="label" fill="#1d4ed8">节日彩蛋挂件</text>
      <text x="150" y="36" text-anchor="middle" class="small" fill="#1d4ed8">不覆盖 Dock 与核心快捷操作区</text>
    </g>
    <g transform="translate(60,290)">
      <polygon points="40,0 300,0 260,44 0,44" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
      <text x="150" y="27" text-anchor="middle" class="label" fill="#6b7280">普通桌面内容（壁纸 / 卡片）</text>
    </g>
    <line x1="30" y1="120" x2="30" y2="330" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="24" y="228" class="small" transform="rotate(-90 24 228)" text-anchor="middle">优先级由高到低</text>
  </g>

  <!-- 右：仲裁矩阵 -->
  <g transform="translate(480,100)">
    <text x="0" y="0" class="head" font-size="14">事件仲裁：四类响应</text>
    <g transform="translate(0,14)">
      <rect x="0" y="0" width="360" height="66" fill="#f0fdf4" stroke="#059669"/>
      <text x="12" y="22" class="label" fill="#047857">继续</text>
      <text x="12" y="40" class="cell">不遮挡挂件的轻量状态更新</text>
      <text x="12" y="56" class="small">保持当前状态，无需恢复</text>
      <rect x="0" y="74" width="360" height="66" fill="#fffbeb" stroke="#d97706"/>
      <text x="12" y="96" class="label" fill="#b45309">弱化</text>
      <text x="12" y="114" class="cell">语音唤醒、语音播报</text>
      <text x="12" y="130" class="small">暂停动效 · 保留静态挂件 · 结束后不自动重播</text>
      <rect x="0" y="148" width="360" height="66" fill="#fef2f2" stroke="#f87171"/>
      <text x="12" y="170" class="label" fill="#dc2626">暂停</text>
      <text x="12" y="188" class="cell">拖拽地图、阻断性系统弹窗</text>
      <text x="12" y="204" class="small">停止动效与点击 · 保留进度 · 仍在原桌面时恢复</text>
      <rect x="0" y="222" width="360" height="66" fill="#dc2626"/>
      <text x="12" y="244" class="label" fill="#ffffff">终止</text>
      <text x="12" y="262" class="cell" fill="#ffffff">SOS · 热失控 · AVM 等安全相关界面</text>
      <text x="12" y="278" class="small" fill="#fecaca">立即隐藏并清除播放状态 · 不自动续播</text>
    </g>
  </g>

  <text x="40" y="490" class="sub">原则：安全事件拥有最高优先级；非安全事件按注意力竞争、遮挡与手势冲突选择弱化或暂停</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#9ca3af"/></marker>
  </defs>
</svg>
