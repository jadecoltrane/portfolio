<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .head{font-size:12px;font-weight:700;fill:#374151}
    .brand{font-size:13px;font-weight:700;fill:#1f2937}
    .cell{font-size:11px;fill:#374151}
    .small{font-size:11px;fill:#6b7280}
    .grp{font-size:11px;font-weight:700;fill:#9ca3af}
    .chip{font-size:12px;font-weight:700;fill:#1d4ed8}
    .opp{font-size:15px;font-weight:700;fill:#1f2937}
  </style>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="880" height="660" fill="#ffffff"/>

  <text x="40" y="42" class="title">竞品对比矩阵 · 6 款车机节日彩蛋</text>
  <text x="40" y="63" class="sub">维度：触发机制 / 视觉呈现 / 情感价值　　（结论只适用于当时选取的样本与版本，不外推为全行业趋势）</text>

  <!-- 表头 -->
  <g>
    <line x1="40" y1="98" x2="840" y2="98" stroke="#9ca3af" stroke-width="1.4"/>
    <text x="48" y="118" class="head">品牌</text>
    <text x="180" y="118" class="head">触发机制</text>
    <text x="410" y="118" class="head">视觉呈现</text>
    <text x="640" y="118" class="head">情感价值</text>
    <line x1="40" y1="130" x2="840" y2="130" stroke="#d1d5db"/>
  </g>

  <!-- 国际 -->
  <text x="48" y="152" class="grp">国际品牌</text>
  <g>
    <text x="48" y="184" class="brand">宝马</text>
    <text x="180" y="178" class="cell">语音引导触发，节日覆盖面广</text>
    <text x="180" y="196" class="cell">（元旦 / 春节 / 中秋 / 圣诞）</text>
    <text x="410" y="178" class="cell">动画视频 + 车机灯效 +</text>
    <text x="410" y="196" class="cell">语音播报，完整闭环</text>
    <text x="640" y="187" class="cell">「陪伴」与「祝福」的情感链接</text>
    <line x1="40" y1="212" x2="840" y2="212" stroke="#f3f4f6"/>
  </g>
  <g>
    <text x="48" y="248" class="brand">MINI Cooper</text>
    <text x="180" y="242" class="cell">用户可自主切换节日动画主题</text>
    <text x="180" y="260" class="cell">可控性强</text>
    <text x="410" y="242" class="cell">固定角色贯穿各节日，</text>
    <text x="410" y="260" class="cell">不同节日对应不同情境动画</text>
    <text x="640" y="251" class="cell">品牌人格延伸，轻松有趣</text>
    <line x1="40" y1="276" x2="840" y2="276" stroke="#f3f4f6"/>
  </g>
  <g>
    <text x="48" y="312" class="brand">特斯拉</text>
    <text x="180" y="306" class="cell">语音触发 / 触屏启动，</text>
    <text x="180" y="324" class="cell">交互路径最短</text>
    <text x="410" y="306" class="cell">车身灯光 + 音响 + 动画</text>
    <text x="410" y="324" class="cell">多模态联动，全球共用模板</text>
    <text x="640" y="315" class="cell">功能型导向，偏重技术感</text>
    <line x1="40" y1="340" x2="840" y2="340" stroke="#e5e7eb"/>
  </g>

  <!-- 国内 -->
  <text x="48" y="362" class="grp">中国品牌</text>
  <g>
    <text x="48" y="394" class="brand">小米</text>
    <text x="180" y="388" class="cell">语音指令触发，</text>
    <text x="180" y="406" class="cell">轻量化、触发快</text>
    <text x="410" y="388" class="cell">以仪表盘为载体，</text>
    <text x="410" y="406" class="cell">彩蛋体积小，视觉极简统一</text>
    <text x="640" y="397" class="cell">表情化问候，强化品牌亲和力</text>
    <line x1="40" y1="422" x2="840" y2="422" stroke="#f3f4f6"/>
  </g>
  <g>
    <text x="48" y="458" class="brand">理想</text>
    <text x="180" y="452" class="cell">点击解锁，寻宝式逐步通关</text>
    <text x="180" y="470" class="cell">参与门槛高、时长长</text>
    <text x="410" y="452" class="cell">卡通化视觉，</text>
    <text x="410" y="470" class="cell">结合 AI 语音、相机与动画</text>
    <text x="640" y="461" class="cell">家庭与亲子导向</text>
    <line x1="40" y1="486" x2="840" y2="486" stroke="#f3f4f6"/>
  </g>
  <g>
    <text x="48" y="522" class="brand">小鹏</text>
    <text x="180" y="516" class="cell">节庆口令语义触发；</text>
    <text x="180" y="534" class="cell">旋转视角发现隐藏元素</text>
    <text x="410" y="516" class="cell">多等级彩蛋分层</text>
    <text x="410" y="534" class="cell">（普通 / S / SS / SSS）</text>
    <text x="640" y="525" class="cell">探索感与成就感</text>
    <line x1="40" y1="550" x2="840" y2="550" stroke="#9ca3af" stroke-width="1.4"/>
  </g>

  <!-- 收敛 -->
  <g transform="translate(0,576)">
    <text x="40" y="12" class="small">收敛为三种模式</text>
    <g transform="translate(40,24)">
      <rect width="150" height="30" rx="15" fill="#dbeafe" stroke="#2563eb"/>
      <text x="75" y="20" text-anchor="middle" class="chip">完整闭环式</text>
    </g>
    <g transform="translate(202,24)">
      <rect width="150" height="30" rx="15" fill="#dbeafe" stroke="#2563eb"/>
      <text x="75" y="20" text-anchor="middle" class="chip">品牌人格式</text>
    </g>
    <g transform="translate(364,24)">
      <rect width="150" height="30" rx="15" fill="#dbeafe" stroke="#2563eb"/>
      <text x="75" y="20" text-anchor="middle" class="chip">探索游戏式</text>
    </g>
    <line x1="528" y1="39" x2="566" y2="39" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#d)"/>
    <text x="580" y="30" class="opp">三种模式都在答「怎么增加玩法」</text>
    <text x="580" y="52" class="opp" fill="#1d4ed8">没人答「它该怎么出现和退场」</text>
  </g>
</svg>
