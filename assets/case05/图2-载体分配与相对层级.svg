<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .head{font-size:13px;font-weight:700;fill:#374151}
    .label{font-size:13px;font-weight:600;fill:#1f2937}
    .small{font-size:11px;fill:#6b7280}
    .note{font-size:11px;fill:#9ca3af}
    .key{font-size:14px;font-weight:700;fill:#1f2937}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>

  <text x="40" y="42" class="title">载体分配与相对层级</text>
  <text x="40" y="63" class="sub">同一个情绪需求，用两种载体承担；区别不在尺寸，在是否与任务竞争注意力（不使用内部层级编号）</text>

  <!-- 左：相对层级 -->
  <g>
    <text x="60" y="100" class="head">相对层级</text>
    <g transform="translate(60,112)">
      <polygon points="34,0 300,0 266,40 0,40" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
      <text x="150" y="17" text-anchor="middle" class="label" fill="#b91c1c" font-size="12">安全提示 / 阻断性弹窗</text>
      <text x="150" y="32" text-anchor="middle" class="small" fill="#b91c1c">无条件覆盖一切</text>
    </g>
    <g transform="translate(60,164)">
      <polygon points="34,0 300,0 266,40 0,40" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
      <text x="150" y="25" text-anchor="middle" class="label" font-size="12">系统状态（语音 / 通知）</text>
    </g>
    <g transform="translate(60,216)">
      <polygon points="34,0 300,0 266,40 0,40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="150" y="17" text-anchor="middle" class="label" fill="#1d4ed8" font-size="12">彩蛋挂件（可交互）</text>
      <text x="150" y="32" text-anchor="middle" class="small" fill="#1d4ed8">不覆盖 Dock 与核心快捷操作区</text>
    </g>
    <g transform="translate(60,268)">
      <polygon points="34,0 300,0 266,40 0,40" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
      <text x="150" y="25" text-anchor="middle" class="label" fill="#6b7280" font-size="12">普通桌面内容</text>
    </g>
    <g transform="translate(60,320)">
      <polygon points="34,0 300,0 266,40 0,40" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5 3"/>
      <text x="150" y="17" text-anchor="middle" class="label" fill="#4338ca" font-size="12">全屏联屏壁纸（背景）</text>
      <text x="150" y="32" text-anchor="middle" class="small" fill="#4338ca">虚线 = 不参与挂件层级仲裁</text>
    </g>
    <line x1="46" y1="120" x2="46" y2="352" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#ar)"/>
    <text x="34" y="236" class="note" transform="rotate(-90 34 236)" text-anchor="middle">优先级由高到低</text>
  </g>

  <!-- 右：两个载体的落点 -->
  <g transform="translate(430,88)">
    <text x="0" y="12" class="head">两种载体在四个桌面的落点</text>

    <g transform="translate(0,30)">
      <rect width="410" height="76" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="16" y="26" class="label" fill="#4338ca">全屏联屏壁纸</text>
      <text x="16" y="46" class="small" fill="#4338ca">仅壁纸桌面 · 跨中控屏与副驾屏联屏</text>
      <text x="16" y="64" class="small">它就是背景本身，不与任何任务争夺注意力，且由用户主动选择</text>
    </g>

    <g transform="translate(0,120)">
      <rect width="410" height="94" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="16" y="26" class="label" fill="#1d4ed8">边缘挂件（可交互）</text>
      <text x="16" y="46" class="small" fill="#1d4ed8">壁纸 / 导航 / 星球 / 实况　四个桌面</text>
      <text x="16" y="64" class="small">可交互的部分必须退到视野边缘</text>
      <text x="16" y="82" class="small">不遮盖原有控件（含分屏浮窗等极限情况）</text>
    </g>

    <g transform="translate(0,228)">
      <rect width="410" height="52" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 3"/>
      <text x="16" y="24" class="label" fill="#9ca3af">✕　覆盖 Dock 的挂件</text>
      <text x="16" y="42" class="small">与高频按钮争夺同一区域，增加误触风险</text>
    </g>
  </g>

  <line x1="40" y1="400" x2="840" y2="400" stroke="#e5e7eb"/>
  <text x="40" y="428" class="key">全屏不是被否掉的方案，而是被分配到了唯一能容纳它的位置。</text>
  <text x="40" y="452" class="small">在「它是背景」时可以铺满整屏；在「它可被点击」时必须退到边缘。</text>
  <text x="40" y="486" class="note">角色说明：两种载体如何共存、各自的层级与优先级，规则出自本人；视觉表现均非本人产出。</text>
</svg>
