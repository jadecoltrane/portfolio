<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .kicker{font-size:10px;fill:#9ca3af;letter-spacing:1px}
    .step{font-size:11.5px;fill:#374151}
    .stepb{font-size:11.5px;font-weight:700;fill:#1f2937}
    .bad{font-size:11.5px;font-weight:700;fill:#b45309}
    .cap{font-size:10.5px;fill:#6b7280}
    .badge{font-size:10px;font-weight:700;fill:#ffffff}
    .ok{font-size:11.5px;font-weight:700;fill:#047857}
    .src{font-size:9.5px;fill:#9ca3af}
  </style>
  <rect width="880" height="520" fill="#ffffff"/>
  <text x="40" y="36" class="title">当年那一版顺序是怎么排出来的，以及它缺的是哪一步</text>
  <text x="40" y="57" class="sub">左边是实况六步，右边是复盘提出的三条依据。<tspan font-weight="700" fill="#1f2937">左右不是前后版本，是「做过的」与「现在会怎么做」。</tspan></text>

  <!-- 左：六步实况 -->
  <g transform="translate(40,88)">
    <text x="0" y="0" class="kicker">实况 · 当年的六步</text>
    <rect x="0" y="12" width="330" height="330" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>

    <g transform="translate(16,34)">
      <rect x="0" y="0" width="18" height="18" rx="9" fill="#6b7280"/><text x="9" y="13" text-anchor="middle" class="badge">1</text>
      <text x="30" y="13" class="step">以实车已有顺序为基线</text>
      <text x="30" y="30" class="cap">不推翻已形成的肌肉记忆</text>

      <rect x="0" y="48" width="18" height="18" rx="9" fill="#6b7280"/><text x="9" y="61" text-anchor="middle" class="badge">2</text>
      <text x="30" y="61" class="step">去掉 Dock 已常驻的功能</text>
      <text x="30" y="78" class="cap">依据：入口唯一性</text>

      <rect x="0" y="96" width="18" height="18" rx="9" fill="#6b7280"/><text x="9" y="109" text-anchor="middle" class="badge">3</text>
      <text x="30" y="109" class="step">补进法规强制项</text>
      <text x="30" y="126" class="cap">依据：刚性约束</text>

      <rect x="0" y="144" width="18" height="18" rx="9" fill="#b45309"/><text x="9" y="157" text-anchor="middle" class="badge">4</text>
      <text x="30" y="157" class="bad">补进各功能负责人主张「必须有」的</text>
      <text x="30" y="174" class="bad">⚠ 唯一一条没有依据的入口</text>

      <rect x="0" y="192" width="18" height="18" rx="9" fill="#6b7280"/><text x="9" y="205" text-anchor="middle" class="badge">5</text>
      <text x="30" y="205" class="step">凭经验判断使用频次</text>
      <text x="30" y="222" class="cap">当时没有可用埋点</text>

      <rect x="0" y="240" width="18" height="18" rx="9" fill="#6b7280"/><text x="9" y="253" text-anchor="middle" class="badge">6</text>
      <text x="30" y="253" class="step">拿不准处做外部参考，拍板收口</text>
    </g>
    <rect x="16" y="196" width="298" height="42" rx="4" fill="none" stroke="#b45309" stroke-dasharray="4 3"/>
  </g>

  <!-- 箭头 -->
  <path d="M386 250 L436 250" stroke="#1f2937" stroke-width="2" marker-end="url(#f5a)"/>
  <text x="411" y="238" text-anchor="middle" class="cap">关掉第 4 步</text>
  <defs>
    <marker id="f5a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- 右：三条依据 -->
  <g transform="translate(452,88)">
    <text x="0" y="0" class="kicker">复盘提案 · 分轮筛选</text>
    <rect x="0" y="12" width="388" height="330" rx="6" fill="#ffffff" stroke="#047857"/>

    <g transform="translate(18,36)">
      <rect x="0" y="0" width="352" height="78" rx="4" fill="#ecfdf5"/>
      <text x="14" y="24" class="ok">第一轮｜刚性优先</text>
      <text x="14" y="44" class="cap">法规强制项、行驶中必须立即完成的操作，</text>
      <text x="14" y="61" class="cap">无条件在前。这一轮不需要任何数据。</text>

      <rect x="0" y="94" width="352" height="78" rx="4" fill="#ecfdf5"/>
      <text x="14" y="118" class="ok">第二轮｜入口唯一性</text>
      <text x="14" y="138" class="cap">已在 Dock 或其他常驻位置一步可达的，</text>
      <text x="14" y="155" class="cap">不在面板重复占位——面板是稀缺资源。</text>

      <rect x="0" y="188" width="352" height="78" rx="4" fill="#ecfdf5"/>
      <text x="14" y="212" class="ok">第三轮｜使用频率</text>
      <text x="14" y="232" class="cap">前两轮决不出先后时才用到，</text>
      <text x="14" y="249" class="cap">只需要序关系，不需要精确分值。</text>
    </g>
  </g>

  <g transform="translate(40,440)">
    <rect x="0" y="0" width="800" height="48" rx="4" fill="#1f2937"/>
    <text x="20" y="30" font-size="12.5" font-weight="700" fill="#ffffff">第 4 步的去向：负责人的主张不再是独立入口，必须落到上面三条上论证——把「主张」转成「可以有结论的问题」。</text>
  </g>

  <text x="40" y="508" class="src">抽象示意，不含真实功能清单与完整优先级表。右侧框架为 2026 复盘产物，当年未采用。</text>
</svg>
