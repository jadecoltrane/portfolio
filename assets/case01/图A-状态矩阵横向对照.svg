<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .step{font-size:13px;font-weight:700;fill:#1f2937}
    .stepsub{font-size:11px;fill:#6b7280}
    .head{font-size:11.5px;font-weight:700;fill:#ffffff}
    .rowh{font-size:11.5px;font-weight:600;fill:#1f2937}
    .cell{font-size:10.5px;fill:#374151}
    .bad{font-size:10.5px;font-weight:600;fill:#b45309}
    .src{font-size:9.5px;fill:#9ca3af}
    .ok{font-size:11px;fill:#059669;font-weight:700}
    .note{font-size:11px;fill:#374151}
    .kicker{font-size:10px;fill:#9ca3af;letter-spacing:1px}
  </style>
  <rect width="880" height="600" fill="#ffffff"/>
  <text x="40" y="38" class="title">方法：状态矩阵横向拉通</text>
  <text x="40" y="59" class="sub">单看任何一页都合理，不一致只在横向对照时才暴露。功能名已抽象化。</text>

  <!-- ① 逐页审查 -->
  <text x="40" y="96" class="kicker">STEP 1</text>
  <text x="40" y="116" class="step">逐页看：每一页单看都合理</text>
  <text x="40" y="134" class="stepsub">各功能页独立评审通过，没有明显错误</text>

  <g transform="translate(40,150)">
    <rect x="0" y="0" width="130" height="78" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="12" y="20" class="rowh">功能页 A</text>
    <rect x="12" y="30" width="46" height="20" rx="4" fill="#e5e7eb"/><rect x="66" y="30" width="46" height="20" rx="4" fill="#e5e7eb"/>
    <text x="12" y="66" class="ok">✓ 通过</text>

    <rect x="150" y="0" width="130" height="78" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="162" y="20" class="rowh">功能页 B</text>
    <rect x="162" y="30" width="100" height="20" rx="4" fill="#e5e7eb"/>
    <text x="162" y="66" class="ok">✓ 通过</text>

    <rect x="0" y="94" width="130" height="78" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="12" y="114" class="rowh">功能页 C</text>
    <rect x="12" y="124" width="30" height="20" rx="4" fill="#e5e7eb"/><rect x="50" y="124" width="30" height="20" rx="4" fill="#e5e7eb"/><rect x="88" y="124" width="24" height="20" rx="4" fill="#e5e7eb"/>
    <text x="12" y="160" class="ok">✓ 通过</text>

    <rect x="150" y="94" width="130" height="78" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="162" y="114" class="rowh">功能页 D</text>
    <rect x="162" y="124" width="46" height="20" rx="4" fill="#e5e7eb"/><rect x="216" y="124" width="46" height="20" rx="4" fill="#e5e7eb"/>
    <text x="162" y="160" class="ok">✓ 通过</text>
  </g>

  <!-- 箭头 -->
  <g transform="translate(340,240)">
    <path d="M0,0 L46,0" stroke="#9ca3af" stroke-width="2"/>
    <path d="M46,-6 L58,0 L46,6 Z" fill="#9ca3af"/>
    <text x="-4" y="-14" class="stepsub">横向拉通</text>
  </g>

  <!-- ② 矩阵 -->
  <text x="412" y="96" class="kicker">STEP 2</text>
  <text x="412" y="116" class="step">拉进矩阵：同一行出现不同取值</text>
  <text x="412" y="134" class="stepsub">同类交互被建成了不同的模型 —— 不一致点浮出</text>

  <g transform="translate(412,150)">
    <rect x="0" y="0" width="140" height="30" fill="#1f2937"/><text x="70" y="20" text-anchor="middle" class="head">同类交互</text>
    <rect x="140" y="0" width="106" height="30" fill="#1f2937"/><text x="193" y="20" text-anchor="middle" class="head">状态承载</text>
    <rect x="246" y="0" width="90" height="30" fill="#1f2937"/><text x="291" y="20" text-anchor="middle" class="head">失败态</text>
    <rect x="336" y="0" width="92" height="30" fill="#1f2937"/><text x="382" y="20" text-anchor="middle" class="head">禁用原因</text>

    <!-- row 1 -->
    <rect x="0" y="30" width="428" height="46" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="10" y="50" class="rowh">舱内部件控制</text><text x="10" y="66" class="src">来自 页 A / 页 D</text>
    <text x="150" y="49" class="bad">图标 + 底色</text><text x="150" y="65" class="bad">仅底色</text>
    <text x="256" y="49" class="cell">有</text><text x="256" y="65" class="bad">未定义</text>
    <text x="346" y="49" class="cell">有</text><text x="346" y="65" class="cell">有</text>

    <!-- row 2 -->
    <rect x="0" y="76" width="428" height="46" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="10" y="96" class="rowh">多状态切换</text><text x="10" y="112" class="src">来自 页 A / 页 C</text>
    <text x="150" y="95" class="bad">分段选择</text><text x="150" y="111" class="bad">多模切换</text>
    <text x="256" y="95" class="cell">—</text><text x="256" y="111" class="cell">—</text>
    <text x="346" y="95" class="bad">无</text><text x="346" y="111" class="cell">有</text>

    <!-- row 3 -->
    <rect x="0" y="122" width="428" height="46" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="10" y="142" class="rowh">长链路指令</text><text x="10" y="158" class="src">来自 页 B / 页 C</text>
    <text x="150" y="141" class="cell">图标 + 底色</text><text x="150" y="157" class="cell">图标 + 底色</text>
    <text x="256" y="141" class="bad">仅加载态</text><text x="256" y="157" class="bad">仅加载态</text>
    <text x="346" y="141" class="cell">有</text><text x="346" y="157" class="bad">无</text>

    <!-- row 4 -->
    <rect x="0" y="168" width="428" height="46" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="10" y="188" class="rowh">条件受限功能</text><text x="10" y="204" class="src">来自 页 B / 页 D</text>
    <text x="150" y="187" class="cell">灰化</text><text x="150" y="203" class="cell">灰化</text>
    <text x="256" y="187" class="cell">—</text><text x="256" y="203" class="cell">—</text>
    <text x="346" y="187" class="bad">仅"不可用"</text><text x="346" y="203" class="bad">无说明</text>

    <rect x="0" y="30" width="428" height="184" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- 图例 -->
  <g transform="translate(412,382)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#d97706"/>
    <text x="18" y="9" class="note">橙色 = 同一行内取值不一致，或规则缺失</text>
  </g>

  <!-- 结论条 -->
  <g transform="translate(40,430)">
    <rect x="0" y="0" width="800" height="118" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="20" y="30" class="step">为什么必须横向看</text>
    <text x="20" y="56" class="note">每一页都通过了评审，因为评审的单位是「页」。而不一致的单位是「同类交互」——它跨页存在，</text>
    <text x="20" y="76" class="note">任何一次单页评审都看不见它。用户却恰恰是跨页使用的：在 A 功能学会的心智，到 B 功能失效。</text>
    <text x="20" y="102" class="note" font-weight="700" fill="#1f2937">审查的单位错了，再多轮评审也查不出这类问题。</text>
  </g>

  <text x="40" y="576" class="src">2026-08 一致性审查方法示意 · 控件与功能名均已抽象化，不对应任何真实产品定义</text>
</svg>
