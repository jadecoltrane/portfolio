<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .kicker{font-size:10px;fill:#9ca3af;letter-spacing:1px}
    .node{font-size:11.5px;fill:#374151}
    .nodeb{font-size:11.5px;font-weight:700;fill:#1f2937}
    .cap{font-size:10.5px;fill:#6b7280}
    .mark{font-size:10.5px;font-weight:700;fill:#b45309}
    .src{font-size:9.5px;fill:#9ca3af}
  </style>
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="40" y="36" class="title">控制中心在车机信息架构中的位置</text>
  <text x="40" y="57" class="sub">它不是一个页面，是一层覆盖在所有应用之上、从屏幕顶部下拉呼出的系统层。</text>

  <!-- 左：信息架构 -->
  <g transform="translate(40,90)">
    <text x="0" y="0" class="kicker">信息架构</text>
    <rect x="0" y="14" width="300" height="36" rx="4" fill="#1f2937"/>
    <text x="16" y="38" font-size="12.5" font-weight="700" fill="#ffffff">车机系统</text>

    <line x1="18" y1="50" x2="18" y2="206" stroke="#d1d5db"/>
    <g>
      <line x1="18" y1="78" x2="38" y2="78" stroke="#d1d5db"/>
      <rect x="38" y="62" width="200" height="32" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
      <text x="52" y="83" class="node">桌面</text>
      <line x1="18" y1="118" x2="38" y2="118" stroke="#d1d5db"/>
      <rect x="38" y="102" width="200" height="32" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
      <text x="52" y="123" class="node">应用</text>
      <line x1="18" y1="158" x2="38" y2="158" stroke="#d1d5db"/>
      <rect x="38" y="142" width="200" height="32" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
      <text x="52" y="163" class="node">设置（多步配置）</text>
      <line x1="18" y1="206" x2="38" y2="206" stroke="#b45309" stroke-dasharray="3 3"/>
      <rect x="38" y="188" width="200" height="36" rx="4" fill="#fffbeb" stroke="#b45309"/>
      <text x="52" y="211" class="nodeb">控制中心</text>
    </g>
    <text x="38" y="248" class="cap">覆盖层 · 一步可达 · 系统级</text>
    <text x="38" y="266" class="cap">与「设置」的分工：一步操作在这里，</text>
    <text x="38" y="282" class="cap">多步配置在设置页。</text>
  </g>

  <!-- 右：下拉呼出三帧 -->
  <g transform="translate(400,90)">
    <text x="0" y="0" class="kicker">呼出方式</text>
    <g transform="translate(0,14)">
      <rect x="0" y="0" width="130" height="86" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
      <rect x="0" y="0" width="130" height="10" rx="6" fill="#e5e7eb"/>
      <text x="65" y="52" text-anchor="middle" class="cap">应用全屏</text>
      <text x="65" y="108" text-anchor="middle" class="cap">① 任意界面</text>
    </g>
    <path d="M148 57 L168 57" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#f1a)"/>
    <g transform="translate(176,14)">
      <rect x="0" y="0" width="130" height="86" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
      <rect x="0" y="0" width="130" height="34" rx="6" fill="#fde68a" stroke="#b45309"/>
      <text x="65" y="22" text-anchor="middle" class="mark">↓ 下拉</text>
      <text x="65" y="64" text-anchor="middle" class="cap">应用仍在下方</text>
      <text x="65" y="108" text-anchor="middle" class="cap">② 面板随手势跟随</text>
    </g>
    <path d="M324 57 L344 57" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#f1a)"/>
    <g transform="translate(352,14)">
      <rect x="0" y="0" width="130" height="86" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
      <rect x="0" y="0" width="130" height="68" rx="6" fill="#1f2937"/>
      <rect x="12" y="12" width="48" height="18" rx="3" fill="#4b5563"/>
      <rect x="70" y="12" width="48" height="18" rx="3" fill="#4b5563"/>
      <rect x="12" y="38" width="48" height="18" rx="3" fill="#4b5563"/>
      <rect x="70" y="38" width="48" height="18" rx="3" fill="#4b5563"/>
      <text x="65" y="108" text-anchor="middle" class="cap">③ 覆盖在应用之上</text>
    </g>
    <defs>
      <marker id="f1a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="#9ca3af"/>
      </marker>
    </defs>

    <g transform="translate(0,146)">
      <rect x="0" y="0" width="482" height="100" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="16" y="26" class="nodeb">为什么这个位置决定了后面所有的规则</text>
      <text x="16" y="48" class="cap">覆盖层意味着它必须随时能被打断与收回；</text>
      <text x="16" y="66" class="cap">一步可达意味着它是稀缺资源，装不下的</text>
      <text x="16" y="84" class="cap">只能回到设置页，不能靠加一层来解决。</text>
    </g>
  </g>

  <text x="40" y="420" class="src">示意图，抽象化处理：不还原真实界面布局与品牌视觉。</text>
</svg>
