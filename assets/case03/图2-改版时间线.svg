<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 520" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:19px;font-weight:700;fill:#1f2937}
    .sub{font-size:12.5px;fill:#6b7280}
    .band{font-size:11.5px;font-weight:700;fill:#6b7280}
    .dt{font-size:11.5px;font-weight:700;fill:#1d4ed8}
    .nt{font-size:12.5px;font-weight:700;fill:#1f2937}
    .nd{font-size:11px;fill:#6b7280}
    .fs{font-size:11.5px;fill:#9ca3af}
    .key{font-size:12.5px;font-weight:700;fill:#1f2937}
  </style>
<rect width="1240" height="520" fill="#ffffff"/>
<text x="40" y="42" class="title">三十四天的改版路径</text>
<text x="40" y="64" class="sub">每个节点都是先发现自己学不会,才动手改的</text>
<rect x="40.0" y="96" width="77.3" height="22" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="78.7" y="112" class="band" text-anchor="middle">阅读简报</text>
<rect x="117.3" y="96" width="232.0" height="22" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="233.3" y="112" class="band" text-anchor="middle">过渡</text>
<rect x="349.3" y="96" width="850.7" height="22" fill="#eff6ff" stroke="#2563eb"/>
<text x="774.7" y="112" class="band" text-anchor="middle">练习页</text>
<line x1="40" y1="282" x2="1200" y2="282" stroke="#9ca3af" stroke-width="1.4"/>
<circle cx="78.7" cy="282" r="4" fill="#9ca3af"/>
<line x1="78.7" y1="278" x2="78.7" y2="234" stroke="#e5e7eb"/>
<text x="66.7" y="222" class="dt">9/24</text>
<text x="66.7" y="204" class="nt">起点:阅读简报</text>
<text x="66.7" y="186" class="nd">长文精读,纯输入</text>
<circle cx="156.0" cy="282" r="5" fill="#2563eb"/>
<line x1="156.0" y1="287" x2="156.0" y2="324" stroke="#e5e7eb"/>
<text x="144.0" y="342" class="dt">9/28</text>
<text x="144.0" y="360" class="nt">转向口语</text>
<text x="144.0" y="378" class="nd">一晚定下五条规则</text>
<circle cx="233.3" cy="282" r="4" fill="#9ca3af"/>
<line x1="233.3" y1="278" x2="233.3" y2="234" stroke="#e5e7eb"/>
<text x="221.3" y="222" class="dt">10/8</text>
<text x="221.3" y="204" class="nt">砍掉纯输入模块</text>
<text x="221.3" y="186" class="nd">篇幅最长的那一块</text>
<circle cx="310.7" cy="282" r="4" fill="#9ca3af"/>
<line x1="310.7" y1="286" x2="310.7" y2="324" stroke="#e5e7eb"/>
<text x="298.7" y="342" class="dt">10/11</text>
<text x="298.7" y="360" class="nt">积压暴露</text>
<text x="298.7" y="378" class="nd">场景改成职场导向</text>
<circle cx="388.0" cy="282" r="5" fill="#2563eb"/>
<line x1="388.0" y1="277" x2="388.0" y2="234" stroke="#e5e7eb"/>
<text x="376.0" y="222" class="dt">10/12</text>
<text x="376.0" y="204" class="nt">变成练习页</text>
<text x="376.0" y="186" class="nd">英文优先;撤掉朗读</text>
<circle cx="465.3" cy="282" r="4" fill="#9ca3af"/>
<line x1="465.3" y1="286" x2="465.3" y2="324" stroke="#e5e7eb"/>
<text x="453.3" y="342" class="dt">10/14</text>
<text x="453.3" y="360" class="nt">否掉两种题型</text>
<text x="453.3" y="378" class="nd">纠错推迟到第二天</text>
<circle cx="542.7" cy="282" r="4" fill="#9ca3af"/>
<line x1="542.7" y1="278" x2="542.7" y2="234" stroke="#e5e7eb"/>
<text x="530.7" y="222" class="dt">10/15</text>
<text x="530.7" y="204" class="nt">批改模块上线</text>
<text x="530.7" y="186" class="nd">产品真正开始工作</text>
<circle cx="620.0" cy="282" r="4" fill="#9ca3af"/>
<line x1="620.0" y1="286" x2="620.0" y2="324" stroke="#e5e7eb"/>
<text x="608.0" y="342" class="dt">10/16</text>
<text x="608.0" y="360" class="nt">重构模块结构</text>
<text x="608.0" y="378" class="nd">一次性大改</text>
<circle cx="697.3" cy="282" r="5" fill="#dc2626"/>
<line x1="697.3" y1="277" x2="697.3" y2="234" stroke="#e5e7eb"/>
<text x="685.3" y="222" class="dt">10/18</text>
<text x="685.3" y="204" class="nt">最差的一天</text>
<text x="685.3" y="186" class="nd">判分权当晚交出去</text>
<circle cx="774.7" cy="282" r="4" fill="#9ca3af"/>
<line x1="774.7" y1="286" x2="774.7" y2="324" stroke="#e5e7eb"/>
<text x="762.7" y="342" class="dt">10/19</text>
<text x="762.7" y="360" class="nt">加「小练习」一节</text>
<text x="762.7" y="378" class="nd">原产品最后一块删</text>
<circle cx="852.0" cy="282" r="4" fill="#9ca3af"/>
<line x1="852.0" y1="278" x2="852.0" y2="234" stroke="#e5e7eb"/>
<text x="840.0" y="222" class="dt">10/20</text>
<text x="840.0" y="204" class="nt">把修补写成规则</text>
<text x="840.0" y="186" class="nd">写进生成指令</text>
<circle cx="929.3" cy="282" r="4" fill="#9ca3af"/>
<line x1="929.3" y1="286" x2="929.3" y2="324" stroke="#e5e7eb"/>
<text x="917.3" y="342" class="dt">10/24</text>
<text x="917.3" y="360" class="nt">梯度改成四级</text>
<text x="917.3" y="378" class="nd">一次复习一级</text>
<circle cx="1006.7" cy="282" r="5" fill="#2563eb"/>
<line x1="1006.7" y1="277" x2="1006.7" y2="234" stroke="#e5e7eb"/>
<text x="994.7" y="222" class="dt">10/25</text>
<text x="994.7" y="204" class="nt">四级一次全上线</text>
<text x="994.7" y="186" class="nd">当天二十张重出</text>
<circle cx="1084.0" cy="282" r="4" fill="#9ca3af"/>
<line x1="1084.0" y1="286" x2="1084.0" y2="324" stroke="#e5e7eb"/>
<text x="1072.0" y="342" class="dt">10/26</text>
<text x="1072.0" y="360" class="nt">提示一律英文</text>
<text x="1072.0" y="378" class="nd">并要能锁定目标</text>
<circle cx="1161.3" cy="282" r="5" fill="#2563eb"/>
<line x1="1161.3" y1="277" x2="1161.3" y2="234" stroke="#e5e7eb"/>
<text x="1200.0" y="222" class="dt" text-anchor="end">10/27</text>
<text x="1200.0" y="204" class="nt" text-anchor="end">失败分成三种</text>
<text x="1200.0" y="186" class="nd" text-anchor="end">换了说法单独一档</text>
<line x1="40" y1="414" x2="1200" y2="414" stroke="#e5e7eb"/>
<text x="40" y="442" class="key">形态变了两次,规则只加不减:9/28 定下的五条,一条没被推翻。</text>
<text x="40" y="468" class="fs">节点取自 9/24–10/27 的改版记录。蓝点为形态或判定口径的变化,红点为数据最差的一天。</text>
<text x="40" y="490" class="fs">轴为事件顺序,非等比时间轴。</text>
</svg>