<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .lbl{font-size:11px;font-weight:700;fill:#9ca3af}
    .lblg{font-size:11px;font-weight:700;fill:#15803d}
    .sec{font-size:13px;font-weight:700;fill:#1f2937}
    .en{font-size:13px;fill:#9ca3af}
    .enb{font-size:14px;font-weight:700;fill:#1f2937}
    .chunk{font-size:14px;font-weight:700;fill:#1d4ed8}
    .note{font-size:11px;fill:#6b7280}
    .mid{font-size:12px;font-weight:700;fill:#b45309}
    .aside{font-size:11px;font-weight:700;fill:#2563eb}
    .ft{font-size:12px;fill:#374151}
  </style>
  <rect width="880" height="520" fill="#ffffff"/>

  <text x="40" y="42" class="title">批改卡为什么是两块,不是一块</text>
  <text x="40" y="63" class="sub">两块服务的是两个不同的时间点:一块今天就能用,一块一个月后才算数</text>

  <!-- 第一块 -->
  <rect x="40" y="92" width="800" height="186" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="64" y="120" class="sec">第一块 · 昨天这句话,怎么说更地道</text>
  <text x="700" y="120" class="aside">今天就能照着改口</text>

  <text x="64" y="150" class="lbl">你说的</text>
  <text x="64" y="172" class="en">Honestluuy. I have not test with real drivers</text>

  <text x="64" y="204" class="lblg">更地道</text>
  <rect x="64" y="212" width="3" height="30" fill="#15803d"/>
  <text x="80" y="234" class="enb">Honestly, I haven't tested it with real drivers yet. That's what I'd do next.</text>

  <text x="64" y="264" class="note">规律①:先老实回答,面试官会尊重。语法:have not 后面要用过去分词 tested,再加 yet 表示「到现在还没」。</text>

  <!-- 中间 -->
  <line x1="440" y1="278" x2="440" y2="302" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="458" y="298" class="mid">刻意不合并</text>

  <!-- 第二块 -->
  <rect x="40" y="302" width="800" height="138" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="64" y="330" class="sec">第二块 · 从我这句话里提出来的新表达</text>
  <text x="704" y="330" class="aside">一个月后才算数</text>

  <text x="64" y="366" class="chunk">That's what I'd do next.</text>
  <text x="64" y="390" class="note">意思:坦白某件事还没做,后面补一句下一步。</text>
  <text x="64" y="414" class="note">单独存进复习队列,三天、七天、二十天后各在一个新情境里重考一次。</text>

  <line x1="40" y1="464" x2="840" y2="464" stroke="#e5e7eb"/>
  <text x="40" y="486" class="ft">只给「正确答案」的批改没用——那不是我会说的话,下次还是说不出来。</text>
  <text x="40" y="506" class="ft">所以改写归改写,提炼归提炼:前者让我今天改口,后者才进得了长期记忆。</text>
</svg>
