<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <style>
    .title{font-size:18px;font-weight:700;fill:#1f2937}
    .sub{font-size:12px;fill:#6b7280}
    .ax{font-size:11px;fill:#6b7280}
    .pct{font-size:12px;font-weight:700;fill:#1f2937}
    .lg{font-size:11px;fill:#6b7280}
    .cal{font-size:11px;fill:#b45309}
    .bad{font-size:12px;font-weight:700;fill:#dc2626}
    .ft{font-size:12px;fill:#374151}
    .fs{font-size:11px;fill:#9ca3af}
    .brk{font-size:11px;fill:#b45309}
  </style>
  <rect width="880" height="530" fill="#ffffff"/>

  <text x="40" y="42" class="title">八天的复习结果</text>
  <text x="40" y="63" class="sub">每天到期卡片的三档判定占比　2026-10-13 至 10-20</text>

  <g>
    <rect x="40"  y="84" width="10" height="10" fill="#2563eb"/><text x="58"  y="93" class="lg">记得</text>
    <rect x="110" y="84" width="10" height="10" fill="#b45309"/><text x="128" y="93" class="lg">差一点</text>
    <rect x="192" y="84" width="10" height="10" fill="#dc2626"/><text x="210" y="93" class="lg">没想起来</text>
    <text x="744" y="93" class="lg">记得占比</text><text x="812" y="93" class="lg">到期</text>
  </g>

  <g>
    <text x="40" y="140" class="ax">10/13</text>
    <rect x="108" y="124" width="620" height="22" fill="#2563eb" fill-opacity="0.35"/>
    <text x="118" y="140" class="cal">只答了 2 张,按规则不计</text>
    <text x="744" y="140" class="pct" fill="#9ca3af">—</text>
    <text x="812" y="140" class="fs">2 张</text>
  </g>
  <g>
    <text x="40" y="180" class="ax">10/14</text>
    <rect x="108" y="164" width="558" height="22" fill="#2563eb"/>
    <rect x="666" y="164" width="62" height="22" fill="#dc2626"/>
    <text x="744" y="180" class="pct">90%</text>
    <text x="812" y="180" class="fs">10 张</text>
  </g>
  <g>
    <text x="40" y="220" class="ax">10/15</text>
    <rect x="108" y="204" width="496" height="22" fill="#2563eb"/>
    <rect x="604" y="204" width="124" height="22" fill="#dc2626"/>
    <text x="744" y="220" class="pct">80%</text>
    <text x="812" y="220" class="fs">10 张</text>
  </g>
  <g>
    <text x="40" y="260" class="ax">10/16</text>
    <rect x="108" y="244" width="542" height="22" fill="#2563eb"/>
    <rect x="650" y="244" width="78" height="22" fill="#dc2626"/>
    <text x="744" y="260" class="pct">88%</text>
    <text x="812" y="260" class="fs">16 张</text>
  </g>
  <g>
    <text x="40" y="300" class="ax">10/17</text>
    <rect x="108" y="284" width="399" height="22" fill="#2563eb"/>
    <rect x="507" y="284" width="89" height="22" fill="#b45309"/>
    <rect x="596" y="284" width="132" height="22" fill="#dc2626"/>
    <text x="744" y="300" class="pct">64%</text>
    <text x="812" y="300" class="fs">14 张</text>
  </g>
  <g>
    <text x="40" y="340" class="ax">10/18</text>
    <rect x="108" y="324" width="109" height="22" fill="#b45309"/>
    <rect x="217" y="324" width="511" height="22" fill="#dc2626"/>
    <text x="744" y="340" class="bad">0%</text>
    <text x="812" y="340" class="fs">17 张</text>
  </g>
  <g>
    <text x="40" y="400" class="ax">10/19</text>
    <rect x="108" y="384" width="310" height="22" fill="#2563eb"/>
    <rect x="418" y="384" width="62" height="22" fill="#b45309"/>
    <rect x="480" y="384" width="248" height="22" fill="#dc2626"/>
    <text x="744" y="400" class="pct">50%</text>
    <text x="812" y="400" class="fs">20 张</text>
  </g>
  <g>
    <text x="40" y="440" class="ax">10/20</text>
    <rect x="108" y="424" width="279" height="22" fill="#2563eb"/>
    <rect x="387" y="424" width="62" height="22" fill="#b45309"/>
    <rect x="449" y="424" width="279" height="22" fill="#dc2626"/>
    <text x="744" y="440" class="pct">45%</text>
    <text x="812" y="440" class="fs">20 张</text>
  </g>

  <line x1="40" y1="368" x2="840" y2="368" stroke="#b45309" stroke-dasharray="4 4"/>
  <text x="40" y="386" class="brk">10/18 当晚改了判定方式——这条线上下两段不能直接比</text>

  <line x1="40" y1="470" x2="840" y2="470" stroke="#e5e7eb"/>
  <text x="40" y="492" class="ft">10/18 十七张卡零个记得。当晚查出问题在题面,改了四处。</text>
  <text x="40" y="512" class="fs">线以上是自己判记不记得;线以下改成由 AI 判说得自不自然,同时每天到期量从十张涨到二十张。</text>
</svg>