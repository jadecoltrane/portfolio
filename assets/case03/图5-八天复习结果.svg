<text x="40" y="428" class="ft">记得率从 90% 跌到 45%,记得的个数从 9 个到 9 个——中间变的是谁说了算。</text>
<text x="40" y="448" class="ft">我自己判的 64 张记得 42 张(66%);机器或 AI 判的 45 张记得 19 张(42%);同期每天到期量从十张涨到二十张。</text>
<text x="40" y="468" class="ft">八天、一个人、没有对照组,证明不了方法有效。能证明的是:口径一换,同一个人、同一套内容的数字会差一倍。</text>
<text x="40" y="488" class="fs">口径:记得率 = 记得 ÷ 当天做完的张数;判定方式按卡片有没有留下机器批改记录区分。</text>
<text x="40" y="508" class="fs">10/13、10/17 没做完,图里用虚线框标出到期但没做的部分,不补算、不剔除。</text>
</svg>