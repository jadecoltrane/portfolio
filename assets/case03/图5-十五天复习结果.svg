<text x="40" y="686" class="ft">自行判定的五天(10/13–10/17):每天做10.4张,判为记得8.4张,占81%;期间有未完成日。</text>
<text x="40" y="706" class="ft">机器／AI判定的五天(10/19–10/23):每天做19.6张,判为记得11.4张,占58%;五天均做完。</text>
<text x="40" y="726" class="ft">记得率下降23个百分点;每日判为「记得」的卡片从8.4张变为11.4张,不能直接推断学习效果。</text>
<text x="40" y="746" class="ft">四级梯度之后(10/24、10/26、10/27 三个整天):每天做 20 张,记得 8.7 个。题变难了,数字跟着掉。</text>
<text x="40" y="766" class="ft">边界:单用户、无对照组,题量、题型和判定方式均变过。这些数据可检查判定方式,不能证明学习效果。</text>
<text x="40" y="786" class="fs">口径:记得率 = 记得 ÷ 当天做完的张数;判定方式按卡片有没有留下机器批改记录区分。10/13、10/17、10/25 没做完,图里用虚线框标出到期但没做的部分,不补算、不剔除。10/27 起"模糊"在库里分成"差一点"与"换了说法",图上仍合并显示。</text>
